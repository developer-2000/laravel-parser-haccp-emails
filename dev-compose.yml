services:

  app:
    build: .
    container_name: app
    restart: unless-stopped
    ports:
      - "8080:80"
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    dns:
      - 8.8.8.8
      - 8.8.4.4

  queue:
    build: .
    container_name: queue
    restart: unless-stopped
    command: php artisan horizon
    stop_signal: SIGTERM
    stop_grace_period: 30s
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
    depends_on:
      app:
        condition: service_healthy
      searxng:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 8.8.4.4
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1.5G

  scheduler:
    build: .
    container_name: scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
    depends_on:
      app:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 8.8.4.4

  db:
    image: mysql:8
    container_name: db
    restart: unless-stopped
    command: >
      --innodb_buffer_pool_size=1G
      --innodb_log_buffer_size=64M
      --max_connections=200
    environment:
      MYSQL_DATABASE: parser_haccp
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./docker/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - INSTANCE_NAME=parser-haccp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 256M
    depends_on:
      db:
        condition: service_healthy

volumes:
  app_vendor:
  db_data:
  redis_data:
